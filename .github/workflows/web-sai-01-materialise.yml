name: WEB-SAI-01 materialise approved HANDOFF asset

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed feature branch
        uses: actions/checkout@v4
        with:
          ref: web/WEB-01F-core-front-end
          fetch-depth: 0

      - name: Reconstruct exact approved HANDOFF binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/sai
          cat \
            .web-sai-tmp/handoff-part-00.bin \
            .web-sai-tmp/handoff-part-01.bin \
            .web-sai-tmp/handoff-part-02.bin \
            .web-sai-tmp/handoff-part-03.bin \
            .web-sai-tmp/handoff-part-04.bin \
            .web-sai-tmp/handoff-part-05.bin \
            .web-sai-tmp/handoff-part-06.bin \
            .web-sai-tmp/handoff-part-07.bin \
            > public/assets/sai/sai-comp-handoff-upper-website-l-light-fc-v1.0.0.webp

      - name: Verify all three approved SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '5ba0a021414c40e9ae65796a83138f1f8f1cd4f622a85cdabd35e1209bdb9d48' \
            'public/assets/sai/sai-mark-na-na-website-xs64-dark-fc-v1.0.0.png' \
            '4938b9e3026ed6c2658ce4c62c007376a568e19811d5dbcd156ae8b16d372105' \
            'public/assets/sai/sai-comp-handoff-upper-website-l-light-fc-v1.0.0.webp' \
            '3d0ec2a20b642405d3e536201f85fbf2c5aa56e04c6b680989e538bd169864cb' \
            'public/assets/sai/sai-state-orient-upper-website-m-light-fc-v1.0.0.webp' \
            | sha256sum --check --strict

      - name: Persist approved binaries and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TechSafeAI WEB-SAI-01'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/sai/sai-comp-handoff-upper-website-l-light-fc-v1.0.0.webp
          git rm \
            .web-sai-tmp/handoff-part-00.bin \
            .web-sai-tmp/handoff-part-01.bin \
            .web-sai-tmp/handoff-part-02.bin \
            .web-sai-tmp/handoff-part-03.bin \
            .web-sai-tmp/handoff-part-04.bin \
            .web-sai-tmp/handoff-part-05.bin \
            .web-sai-tmp/handoff-part-06.bin \
            .web-sai-tmp/handoff-part-07.bin \
            .github/workflows/web-sai-01-materialise.yml
          git diff --cached --check
          git commit -m 'chore(web-sai-01): materialise approved handoff asset'
          git push origin HEAD:web/WEB-01F-core-front-end
